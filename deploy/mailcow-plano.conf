# Copy to <mailcow>/data/conf/nginx/plano.conf (mounted as /etc/nginx/conf.d),
# add the domain to ADDITIONAL_SAN in mailcow.conf, validate with `nginx -t`,
# then reload. Mailcow's ACME container issues the certificate; port 80
# redirects and ACME challenges stay Mailcow's.
server {
  # Mailcow's own listen directives, so ports and IPv6 always match its setup.
  include /etc/nginx/conf.d/listen_ssl.active;
  server_name plano.synapseengineering.dev;

  ssl_certificate /etc/ssl/mail/cert.pem;
  ssl_certificate_key /etc/ssl/mail/key.pem;

  client_max_body_size 1m;

  # Resolve at request time through Docker's DNS: a static upstream would stop
  # nginx (and webmail with it) from starting whenever Plano is down.
  resolver 127.0.0.11 valid=30s;
  set $plano_upstream http://plano-web:80;

  location / {
    proxy_pass $plano_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
