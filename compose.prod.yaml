# Production stack for the VPS. Images are built by GitHub Actions:
#   docker compose -f compose.prod.yaml pull && docker compose -f compose.prod.yaml up -d
# Values come from the root .env (see .env.production.example).
#
# The VPS also runs Mailcow, whose nginx owns ports 80/443 and terminates HTTPS
# (see deploy/mailcow-plano.conf). Plano publishes no port: Mailcow's nginx
# reaches the `web` service over the shared Mailcow network.
# Memory limits keep Plano from starving the mail stack.
name: plano-prod

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: plano
    volumes:
      - db-data:/var/lib/postgresql
    mem_limit: 384m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plano -d plano']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ghcr.io/nefrozdev/plano-api:latest
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      FRONTEND_URL: https://${DOMAIN:?Set DOMAIN in .env}
      DATABASE_URL: postgres://plano:${POSTGRES_PASSWORD}@db:5432/plano
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 320m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    image: ghcr.io/nefrozdev/plano-web:latest
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    networks:
      default:
      mailcow:
        # The name Mailcow's nginx proxies to.
        aliases: [plano-web]
    depends_on:
      api:
        condition: service_healthy

networks:
  mailcow:
    external: true
    name: ${MAILCOW_NETWORK:-mailcowdockerized_mailcow-network}

volumes:
  db-data:
