<app-auth-shell>
  <section class="auth-card" aria-labelledby="login-title">
    <h2 id="login-title">Connexion</h2>
    <p class="intro">
      Plano utilise votre compte Synapse&nbsp;: le même pour toutes les applications de
      Synapse Engineering. Vous pouvez aussi en créer un.
    </p>

    @if (notice()) {
      <div class="form-error" role="alert">{{ notice() }}</div>
    }

    <button
      class="primary-button"
      type="button"
      [disabled]="leaving()"
      [attr.aria-busy]="leaving()"
      (click)="start()"
    >
      @if (leaving()) {
        <span class="button-spinner" aria-hidden="true"></span>
        Redirection…
      } @else {
        Se connecter ou créer un compte
      }
    </button>
  </section>
</app-auth-shell>
