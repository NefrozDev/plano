<app-auth-shell>
  <section class="auth-card" aria-labelledby="login-title">
    <h2 id="login-title">{{ 'auth.login.heading' | transloco }}</h2>
    <p class="intro">{{ 'auth.login.intro' | transloco }}</p>

    @if (notice()) {
      <div class="form-error" role="alert">{{ notice() | transloco }}</div>
    }

    <button
      class="primary-button"
      type="button"
      [disabled]="leaving()"
      [attr.aria-busy]="leaving()"
      (click)="start()"
    >
      @if (leaving()) {
        <span class="button-spinner" aria-hidden="true"></span>
        {{ 'auth.login.redirecting' | transloco }}
      } @else {
        {{ 'auth.login.start' | transloco }}
      }
    </button>
  </section>
</app-auth-shell>
