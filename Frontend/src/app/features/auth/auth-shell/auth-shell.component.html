<div class="auth-page">
  <main class="auth-shell" [class.auth-shell--compact]="compact">
    <header class="auth-brand" aria-labelledby="plano-title">
      <svg
        class="auth-brand__mark"
        viewBox="0 0 64 80"
        role="img"
        aria-label="Logo Plano"
      >
        <defs>
          <linearGradient id="plano-gradient" x1="12" y1="65" x2="54" y2="7">
            <stop offset="0" stop-color="#6B2DEB" />
            <stop offset="0.58" stop-color="#325BE2" />
            <stop offset="1" stop-color="#2639F5" />

        </defs>
        <path
          fill="url(#plano-gradient)"

        <circle cx="39" cy="25" r="9.4" fill="#DCEAFF" />
        <circle cx="50.3" cy="12.2" r="3.2" fill="#F6FAFF" />

      <h1 id="plano-title">Plano</h1>
      <p>Vos ambitions méritent un plan</p>
    </header>

    <ng-content />
  </main>
</div>
