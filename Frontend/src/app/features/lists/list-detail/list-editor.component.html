<section class="list-editor" aria-labelledby="editor-title">
  <header class="editor-header">
    <button type="button" [attr.aria-label]="'lists.editor.cancel' | transloco" (click)="closed.emit()">×</button>
    <h2 id="editor-title">{{ 'lists.edit' | transloco }}</h2>
    <button class="save-editor" type="button" [attr.aria-label]="'lists.editor.save' | transloco" (click)="submit()">✓</button>
  </header>

  <div class="editor-content">
    <label class="editor-field">
      <span>{{ 'lists.editor.name' | transloco }}</span>
      <input
        #nameInput
        type="text"
        maxlength="80"
        [value]="draftName()"
        (input)="draftName.set($any($event.target).value)"
      />
    </label>

    <fieldset class="editor-options icon-options">
      <legend>{{ 'lists.editor.icon' | transloco }}</legend>
      <app-list-icon-picker [(value)]="draftIcon" />
    </fieldset>

    <fieldset class="editor-options color-options">
      <legend>{{ 'lists.editor.color' | transloco }}</legend>
      <div>
        @for (color of colorChoices; track color) {
          <button
            type="button"
            [class.selected]="draftColor() === color"
            [style.background]="color"
            [attr.aria-label]="'lists.editor.pickColor' | transloco: { color }"
            [attr.aria-pressed]="draftColor() === color"
            (click)="draftColor.set(color)"
          ><span aria-hidden="true">✓</span></button>
        }
      </div>
    </fieldset>

    <section class="editor-behaviour" [attr.aria-label]="'lists.editor.checked' | transloco">
      <app-switch-row
        [label]="'lists.editor.removeChecked' | transloco"
        [checked]="draftRemoveChecked()"
        (toggled)="draftRemoveChecked.set(!draftRemoveChecked())"
      />
      <p>{{ 'lists.editor.removeCheckedHint' | transloco }}</p>
    </section>

    <section class="sharing-editor" aria-labelledby="sharing-title">
      <h3 id="sharing-title">{{ 'lists.editor.sharedWith' | transloco }}</h3>
      <div class="sharing-row">
        <app-avatar-stack [people]="people()" [max]="4" />
        <button type="button" (click)="openSharing()"><span aria-hidden="true">＋</span> {{ 'lists.editor.invite' | transloco }}</button>
      </div>
    </section>

    <label class="editor-field description-field">
      <span>{{ 'lists.editor.description' | transloco }}</span>
      <textarea
        rows="3"
        maxlength="500"
        [placeholder]="'lists.editor.descriptionPlaceholder' | transloco"
        [value]="draftDescription()"
        (input)="draftDescription.set($any($event.target).value)"
      ></textarea>
    </label>

    <button class="delete-list" type="button" (click)="delete.emit()">{{ 'lists.editor.delete' | transloco }}</button>
  </div>
</section>
