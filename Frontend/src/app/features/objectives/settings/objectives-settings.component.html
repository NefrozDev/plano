<app-page-header heading="Paramètres Objectifs" backLink="/objectives" backLabel="Retour aux objectifs" />

<div class="content">
  <section>
    <h2>Général</h2>
    <label class="setting-row">
      <span>Vue par défaut</span>
      <select class="choice-select" (change)="update({ defaultView: $any($event.target).value })">
        <option value="list" [selected]="settings().defaultView === 'list'">Liste</option>
        <option value="grid" [selected]="settings().defaultView === 'grid'">Grille</option>
      </select>
    </label>
    <app-switch-row label="Afficher les objectifs archivés dans « Tous »" [checked]="settings().showArchived" (toggled)="toggle('showArchived')" />
  </section>

  <section>
    <h2>Rappels</h2>
    <label class="setting-row">
      <span>Rappel d’échéance par défaut</span>
      <select class="choice-select" (change)="update({ defaultDueReminder: $any($event.target).value })">
        @for (option of dueReminders; track option[0]) {
          <option [value]="option[0]" [selected]="settings().defaultDueReminder === option[0]">{{ option[1] }}</option>
        }
      </select>
    </label>
    <app-switch-row label="Notifications d’objectifs" [checked]="settings().notifications" (toggled)="toggle('notifications')" />
    <label class="setting-row">
      <span>Rappels d’habitudes</span>
      <select class="choice-select" (change)="update({ habitReminders: $any($event.target).value })">
        <option value="scheduled" [selected]="settings().habitReminders === 'scheduled'">À l’heure définie</option>
        <option value="none" [selected]="settings().habitReminders === 'none'">Désactivés</option>
      </select>
    </label>
  </section>

  <section>
    <h2>Affichage</h2>
    <app-switch-row label="Afficher la progression en pourcentage" [checked]="settings().showPercentage" (toggled)="toggle('showPercentage')" />
    <app-switch-row label="Couleur par catégorie" [checked]="settings().categoryColors" (toggled)="toggle('categoryColors')" />
  </section>
</div>
