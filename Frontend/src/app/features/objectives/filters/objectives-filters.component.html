<app-page-header [heading]="'agenda.filters.heading' | transloco" backLink="/objectives" [backLabel]="'objectives.backToObjectives' | transloco">
  <button class="reset" type="button" (click)="store.resetFilters()">{{ 'agenda.filters.reset' | transloco }}</button>
</app-page-header>

<div class="content">
  <fieldset>
    <legend>{{ 'objectives.filters.status' | transloco }}</legend>
    <label class="option">
      <span>{{ 'objectives.tabs.all' | transloco }}</span>
      <input type="checkbox" [checked]="!filters().statuses.length" (change)="clear('statuses', $event)" />
      <i aria-hidden="true"></i>
    </label>
    @for (status of statuses; track status[0]) {
      <label class="option">
        <span>{{ status[1] | transloco }}</span>
        <input type="checkbox" [checked]="filters().statuses.includes(status[0])" (change)="toggleStatus(status[0])" />
        <i aria-hidden="true"></i>
      </label>
    }
  </fieldset>

  <fieldset>
    <legend>{{ 'objectives.filters.categories' | transloco }}</legend>
    <label class="option">
      <span>{{ 'objectives.filters.allCategories' | transloco }}</span>
      <input type="checkbox" [checked]="!filters().categories.length" (change)="clear('categories', $event)" />
      <i aria-hidden="true"></i>
    </label>
    @for (category of categories; track category.value) {
      <label class="option">
        <span class="category">
          <app-objective-icon [category]="category.value" [color]="category.color" />
          {{ category.label | transloco }}
        </span>
        <input type="checkbox" [checked]="filters().categories.includes(category.value)" (change)="toggleCategory(category.value)" />
        <i aria-hidden="true"></i>
      </label>
    }
  </fieldset>

  <fieldset>
    <legend>{{ 'objectives.filters.sort' | transloco }}</legend>
    <div class="sort">
      <select [attr.aria-label]="'objectives.filters.sortBy' | transloco" (change)="setSort({ sort: $any($event.target).value })">
        <option value="manual" [selected]="filters().sort === 'manual'">{{ 'objectives.filters.manual' | transloco }}</option>
        <option value="dueDate" [selected]="filters().sort === 'dueDate'">{{ 'objectives.filters.dueDate' | transloco }}</option>
        <option value="progress" [selected]="filters().sort === 'progress'">{{ 'objectives.filters.progress' | transloco }}</option>
        <option value="title" [selected]="filters().sort === 'title'">{{ 'objectives.filters.title' | transloco }}</option>
      </select>
      <select [attr.aria-label]="'objectives.filters.order' | transloco" (change)="setSort({ direction: $any($event.target).value })">
        <option value="asc" [selected]="filters().direction === 'asc'">{{ 'objectives.filters.asc' | transloco }}</option>
        <option value="desc" [selected]="filters().direction === 'desc'">{{ 'objectives.filters.desc' | transloco }}</option>
      </select>
    </div>
  </fieldset>
</div>

<div class="actions">
  <a class="primary-button" routerLink="/objectives">{{ 'objectives.filters.show' | count: resultCount() }}</a>
</div>
