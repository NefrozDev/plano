@if (editing()) {
  <form class="editor" (submit)="$event.preventDefault(); save()">
    <div class="field" [class.error]="status() === 'invalid' || status() === 'taken'">
      <span aria-hidden="true">&#64;</span>
      <input
        appAutofocus
        type="text"
        maxlength="30"
        autocapitalize="none"
        autocomplete="username"
        spellcheck="false"
        [attr.aria-label]="'settings.profile.username.label' | transloco"
        [attr.aria-invalid]="status() === 'invalid' || status() === 'taken'"
        aria-describedby="username-status"
        [value]="draft()"
        (input)="draft.set($any($event.target).value)"
        (keydown.escape)="cancel()"
      />
    </div>
    <p
      id="username-status"
      class="status"
      [class.error]="status() === 'invalid' || status() === 'taken' || saveError()"
      [class.ok]="status() === 'available'"
      aria-live="polite"
    >
      {{ (saveError() || 'settings.profile.username.' + status()) | transloco }}
    </p>
    <div class="actions">
      <button class="secondary" type="button" (click)="cancel()">{{ 'settings.profile.username.cancel' | transloco }}</button>
      <button class="save" type="submit" [disabled]="!canSave() && status() !== 'unchanged'">
        {{ (saving() ? 'settings.profile.saving' : 'settings.profile.username.save') | transloco }}
      </button>
    </div>
  </form>
} @else {
  <button class="username" type="button" [attr.aria-label]="'settings.profile.username.edit' | transloco: { username: username() }" (click)="start()">
    <span>&#64;{{ username() }}</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16Z" /><path d="m13.5 6.5 4 4" /></svg>
  </button>
}
