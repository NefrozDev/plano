# Verifies every change, then builds the production images on GitHub so the
# VPS (shared with Mailcow) never runs a memory-hungry build. The VPS only
# pulls them. Images are published only from main, after all checks pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      # No dependency install scripts: every package used here ships prebuilt binaries.
      - run: npm ci --ignore-scripts
      - run: npm run lint:check
      - run: npm run build
      # Unit and end-to-end tests start PostgreSQL with Testcontainers,
      # which uses the Docker engine preinstalled on GitHub runners.
      - run: npm run test:cov
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Angular 22 and NestJS 12 tooling need Node ^24.15.
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      # No dependency install scripts: every package used here ships prebuilt binaries.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:browser-install -- --with-deps
      - run: npm run test:cov
      - run: npm run build

  images:
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: plano-api
            dockerfile: Backend/Dockerfile
          - image: plano-web
            dockerfile: Frontend/Dockerfile
    steps:
      # Third-party actions are pinned to a commit: this job can push the images
      # the VPS deploys, so a moved tag must not be able to change what runs here.
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/nefrozdev/${{ matrix.image }}:latest
            ghcr.io/nefrozdev/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
